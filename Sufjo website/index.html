<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Weekly shift schedule with clock in and clock out.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3' width='20' height='19' rx='4' fill='%233e2fc4'/%3E%3Crect x='6' y='10' width='4' height='3' rx='.6' fill='white'/%3E%3Crect x='14' y='10' width='4' height='3' rx='.6' fill='white'/%3E%3Crect x='6' y='15' width='4' height='3' rx='.6' fill='white'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Layout: white app shell. Header (today button, business name that opens the person picker), a grey band with the
   week and the seven day headings, then the week board: thin column rules, today's column tinted mint, centred pill
   labels per area and green shift cards. A white bottom tab bar holds Schedule, Timesheets and Manager. White only. */
:root {
  --bg: #ffffff;
  --band: #f6f6f8;
  --ink: #1e1c3a;
  --text: #3b3a4f;
  --muted: #7d7d8a;
  --line: #e4e4ea;
  --accent: #3e2fc4;
  --accent-ink: #ffffff;
  --accent-soft: #eeecfb;
  --coral: #f2675a;
  --today: #e9f6f2;
  --shift: #d6f5da;
  --shift-hover: #c6efcc;
  --onshift: #8a8a95;
  --onshift-ink: #ffffff;
  --sel-bar: #c9c9d1;
  --go: #1f8f4f;
  --go-ink: #ffffff;
  --done: #1d7a44;
  --late: #a05800;
  --late-soft: #fdf0dc;
  --miss: #b3261e;
  --miss-soft: #fbe0df;
  --pill: #f1f1f4;
  --scrim: rgb(20 18 40 / 0.4);
  --shadow: 0 12px 40px rgb(30 28 58 / 0.18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
.num, .time, .tc-val, .l-sched, .l-w, .tot, .stat .v { font-variant-numeric: tabular-nums; }

.wrap {
  width: 100%;
  max-width: 1440px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; padding-block: 8px 6px; }
.round-btn {
  width: 46px; height: 46px; display: grid; place-items: center; border: 0; border-radius: 50%;
  background: transparent; color: var(--accent);
}
.round-btn:hover { background: var(--accent-soft); }
.title-btn {
  justify-self: center; display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%;
  padding: 6px 10px; border: 0; border-radius: 12px; background: transparent; color: var(--ink);
  font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-align: center;
}
.title-btn:hover { background: var(--band); }
.title-btn span { min-width: 0; overflow-wrap: anywhere; }

.band { background: var(--band); border-block: 1px solid var(--line); }
.weekbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 6px; padding-block: 4px 0; }
.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--line); color: var(--ink); }
.weeklabel { display: flex; align-items: baseline; gap: 6px; font-size: 14px; color: var(--muted); }
.weeklabel strong { color: var(--ink); font-weight: 600; white-space: nowrap; }
.who-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 10px; border: 0; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
}

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dayhead {
  position: relative; display: grid; justify-items: center; padding: 4px 0 12px; border: 0;
  background: transparent; color: var(--muted);
}
.dayhead + .dayhead::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 18px; width: 1px; background: var(--line);
}
.dayhead .dow { font-size: 14px; }
.dayhead .num { font-size: 28px; font-weight: 600; line-height: 1.1; color: var(--ink); }
.dayhead .mon { font-size: 14px; }
.dayhead.is-today .num { color: var(--accent); }
.dayhead.is-sel::after {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 4px; border-radius: 4px; background: var(--sel-bar);
}

/* ---------- main ---------- */
.main { display: grid; gap: 12px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
#banner { display: grid; gap: 8px; padding-top: 12px; }
#banner:empty { display: none; }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px;
  border-radius: 14px; background: var(--band); font-size: 14px; color: var(--text);
}
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; }
.banner strong { color: var(--ink); }
.banner.is-error { background: var(--miss-soft); }
.banner.is-mgr { background: var(--accent-soft); }
.banner.is-mgr strong { color: var(--accent); }
.loading, .empty { padding: 48px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 600; }
.empty p { margin: 0; max-width: 46ch; }

/* ---------- week board ---------- */
.board { position: relative; min-height: 58vh; }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); pointer-events: none; }
.cols > span + span { border-left: 1px solid var(--line); }
.cols > .is-today { background: var(--today); }
.board-inner { position: relative; display: grid; gap: 26px; padding-block: 28px 32px; }
.area { display: grid; gap: 16px; }
.area-name {
  justify-self: center; margin: 0; min-width: min(64%, 360px); padding: 13px 36px; border-radius: 999px;
  background: var(--pill); color: var(--text); font-size: 19px; font-weight: 500; text-align: center; overflow-wrap: anywhere;
}
.row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-inline: 3px; }

.card {
  appearance: none; width: 100%; min-height: 104px; display: flex; flex-direction: column; text-align: left;
  padding: 8px 9px 10px; border: 0; border-radius: 6px; background: var(--shift); color: var(--ink); overflow: hidden;
}
.card:hover { background: var(--shift-hover); }
.card .time { display: grid; font-size: clamp(11px, 0.85vw + 6px, 18px); font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
.ap1 { display: none; }
.card .who { margin-top: 10px; font-size: clamp(11px, 0.45vw + 8.5px, 15px); line-height: 1.3; color: var(--text); overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; }
.card .meta { display: flex; flex-wrap: wrap; gap: 2px 6px; margin-top: auto; padding-top: 8px; font-size: 12px; font-weight: 600; line-height: 1.25; }
.card .meta:empty { display: none; }
.st-ready { color: var(--accent); }
.st-late { color: var(--late); }
.st-done { color: var(--done); display: inline-flex; align-items: center; gap: 3px; }
.st-miss { color: var(--miss); }
.card.s-miss { background: var(--miss-soft); }
.card.s-on { box-shadow: inset 0 0 0 2px var(--onshift); padding-bottom: 0; }
.band-on {
  margin: auto -9px 0; padding: 5px 9px; background: var(--onshift); color: var(--onshift-ink);
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.3;
}
.card.s-on .meta { margin-top: 0; padding-top: 6px; padding-bottom: 6px; }
.card.s-on .meta + .band-on { margin-top: auto; }
.card.is-once { outline: 1.5px dashed var(--onshift); outline-offset: -1.5px; }
.add {
  appearance: none; min-height: 40px; border: 1.5px dashed var(--sel-bar); border-radius: 6px;
  background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600;
}
.add:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- timesheets ---------- */
.hours { display: grid; gap: 16px; padding-top: 16px; }
.sum { display: flex; flex-wrap: wrap; gap: 12px 36px; align-items: flex-end; padding: 16px 18px; background: var(--band); border-radius: 14px; }
.stat { display: grid; gap: 2px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat.on .v { color: var(--go); }
.sum-note { flex: 1 1 220px; margin: 0; font-size: 13px; color: var(--muted); text-align: right; }
.people { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
.person { display: grid; gap: 10px; min-width: 0; padding: 14px 16px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.person-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.avatar {
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; flex: none;
  background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;
}
.person-head h3 { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.tot { font-weight: 600; white-space: nowrap; }
.tot .of { color: var(--muted); font-weight: 400; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--band); font-size: 12px; font-weight: 600; white-space: nowrap; }
.bar { height: 6px; border-radius: 99px; background: var(--band); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--go); }
.lines { list-style: none; margin: 0; padding: 0; }
.line {
  appearance: none; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left;
  display: grid; grid-template-columns: 3.6em minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; font-size: 14px; align-items: baseline;
}
.line:hover .l-sched { color: var(--accent); }
.l-day { font-weight: 600; }
.l-w { font-weight: 600; text-align: right; }
.l-act { grid-column: 2; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.l-diff { grid-column: 3; text-align: right; font-size: 12px; color: var(--muted); }
.line.s-on .l-act { color: var(--go); font-weight: 600; }
.line.s-miss .l-act, .line.s-miss .l-w { color: var(--miss); }
.line.s-up .l-w, .line.s-ready .l-w { color: var(--muted); font-weight: 400; }
.tag-late {
  display: inline-block; padding: 1px 6px; border-radius: 5px; background: var(--late-soft); color: var(--late);
  font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap;
}

/* ---------- footer ---------- */
.foot { display: grid; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.foot p { margin: 0; max-width: 80ch; }
.pill {
  display: inline-flex; align-items: center; margin-right: 6px; padding: 2px 8px; border-radius: 99px;
  background: var(--band); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
}
.pill.ok { background: var(--shift); color: var(--done); }
.pill.bad { background: var(--miss-soft); color: var(--miss); }

/* ---------- bottom tab bar ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-inner { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; max-width: 520px; }
.tab {
  display: grid; justify-items: center; gap: 3px; padding: 6px 4px 4px; border: 0; border-radius: 12px;
  background: transparent; color: var(--muted); font-size: 13px; font-weight: 500;
}
.tab:hover { background: var(--band); }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg, .tab[aria-pressed="true"] svg { color: var(--coral); }

/* ---------- sheet (dialog) ---------- */
#sheet {
  border: 0; padding: 0; background: var(--bg); color: var(--ink); border-radius: 18px;
  width: min(540px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 48px); box-shadow: var(--shadow); overflow: hidden;
}
#sheet::backdrop { background: var(--scrim); }
.sheet { display: grid; gap: 16px; padding: 20px 20px 22px; overflow-y: auto; max-height: calc(100dvh - 48px); }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.sheet-head > div { flex: 1; min-width: 0; }
.eyebrow { margin: 0 0 2px; font-size: 13px; color: var(--muted); }
.sheet-head h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.x-btn { width: 40px; height: 40px; margin: -6px -8px 0 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
.x-btn:hover { background: var(--band); color: var(--ink); }
.lede { margin: 0; color: var(--muted); }

.timecard { display: grid; padding: 2px 16px; border-radius: 14px; background: var(--shift); }
.timecard.is-miss { background: var(--miss-soft); }
.tc-row { display: grid; grid-template-columns: 6.4em minmax(0, 1fr) auto; align-items: baseline; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgb(30 28 58 / 0.08); }
.tc-row:last-child { border-bottom: 0; }
.tc-label { font-size: 13px; color: var(--text); }
.tc-val { font-size: 17px; font-weight: 600; }
.tc-aux { font-size: 13px; color: var(--text); text-align: right; }
.tc-total .tc-val { font-size: 20px; }

.note { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--band); color: var(--text); }
.note.ok { background: var(--shift); color: var(--done); font-weight: 600; }
.note.warn { background: var(--late-soft); color: var(--late); }

.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-weight: 600; font-size: 15px; text-align: center;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn-stop { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-danger { color: var(--miss); border-color: var(--miss); background: transparent; }
.btn-danger[data-armed] { background: var(--miss); color: var(--bg); }
.btn-big { width: 100%; min-height: 58px; font-size: 18px; border-radius: 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btnrow > .btn { flex: 1 1 auto; }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.menu { display: grid; }
.menu-row {
  appearance: none; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 6px; border: 0;
  border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: var(--ink);
}
.menu-row:last-child { border-bottom: 0; }
.menu-row:hover { background: var(--band); }
.menu-row > svg:first-child { color: var(--accent); }
.menu-row > span:not(.avatar) { flex: 1; min-width: 0; display: grid; gap: 1px; }
.menu-row strong { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.menu-row small { color: var(--muted); font-size: 13px; }
.menu-row.is-on strong { color: var(--accent); }
.menu-row.is-on > svg:last-child { color: var(--accent); }

.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; font-size: 14px; font-weight: 600; }
.field legend { padding: 0; margin-bottom: 6px; }
.opt { font-weight: 400; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--band); color: var(--ink); font-size: 16px; font-weight: 400; line-height: 1.3;
}
.field textarea { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); background: var(--bg); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.daypick-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daypick-row button { min-height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--band); font-size: 13px; font-weight: 600; }
.daypick-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.err { margin: 0; font-size: 14px; font-weight: 600; color: var(--miss); }
.err:empty { display: none; }
.subhead { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.divider { width: 100%; margin: 2px 0; border: 0; border-top: 1px solid var(--line); }

.formats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.fmt { display: grid; gap: 6px; min-width: 0; }
.fmt-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.xs-table, .u-table { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.xs-table table, .u-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.xs-table th, .xs-table td, .u-table th, .u-table td { padding: 5px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
.xs-table th, .u-table th { background: var(--band); font-weight: 600; }
.xs-table tr:last-child td, .u-table tr:last-child td { border-bottom: 0; }
.u-table { max-height: 240px; overflow-y: auto; }
.u-preview { display: grid; gap: 8px; }
.u-preview:empty { display: none; }
.u-sum { margin: 0; }
.u-errs { margin: 0; padding-left: 18px; color: var(--late); font-size: 13px; }
.u-facts { margin: 0; padding-left: 18px; color: var(--text); font-size: 13px; display: grid; gap: 2px; }
.gs-row { display: flex; gap: 8px; }
.gs-row input { flex: 1; }
.gs-row .btn { flex: none; }
.layouts { display: grid; gap: 10px; }
.layouts summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
.layouts[open] summary { margin-bottom: 10px; }
.hint-list { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--bg);
  font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translate(-50%, 12px);
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- narrower screens ---------- */
@media (max-width: 700px) {
  .title-btn { font-size: 20px; }
  .dayhead .dow, .dayhead .mon { font-size: 12px; }
  .dayhead .num { font-size: 22px; }
  .board-inner { gap: 22px; padding-block: 22px 26px; }
  .area { gap: 12px; }
  .area-name { font-size: 16px; padding: 10px 26px; }
  .cell { gap: 6px; padding-inline: 2px; }
  .card { min-height: 88px; padding: 6px 5px 7px; }
  .card .who { margin-top: 8px; }
  .card .meta { font-size: 10px; gap: 1px 4px; padding-top: 6px; }

/* ---------- dates and times (minutes from midnight) ---------- */
const pad = n => String(n).padStart(2, '0');

const at = (monday, day, min) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + day, 0, min).getTime();
const shiftMins = s => { let d = s.end - s.start; if (d <= 0) d += 1440; return d; };
const minsOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };

function clockHTML(min) {

  const h = Math.floor(min / 60), m = min % 60;

}

const hhmm = min => `${pad(Math.floor(min / 60) % 24)}:${pad(min % 60)}`;
const fromHHMM = v => { const m = /^(\d{1,2}):(\d{2})/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null; };

  const yr = e.getFullYear() !== new Date().getFullYear() || m.getFullYear() !== e.getFullYear() ? `, ${e.getFullYear()}` : '';

    ? `${MONTHS[m.getMonth()]} ${m.getDate()} – ${e.getDate()}${yr}`

}

/* ---------- reading a schedule (pasted, a CSV file or a Google Sheet) ---------- */
const DAY_WORDS = {
  mo: 0, mon: 0, monday: 0, tu: 1, tue: 1, tues: 1, tuesday: 1, we: 2, wed: 2, weds: 2, wednesday: 2,
  th: 3, thu: 3, thur: 3, thurs: 3, thursday: 3, fr: 4, fri: 4, friday: 4, sa: 5, sat: 5, saturday: 5,
  su: 6, sun: 6, sunday: 6,
};
const MONTH_WORDS = {
  jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4, may: 5, jun: 6, june: 6,
  jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12,
};
const OFF_RE = /^(off|x|-+|–|—|n\/?a|rest|none|leave|vacation|pto|day off|req(uest(ed)?)? off|sick|holiday|closed|0)$/i;
const NAME_RE = /name|employee|staff|person|who|worker|team ?member/;
const AREA_RE = /area|position|role|station|dept|department|section|job|location/;
const SKIP_RE = /total|hours|hrs|notes?|comments?|phone|email|wage|rate|pay/;
const TOTAL_ROW_RE = /^(total|totals|sum|hours|hrs)\b/i;
const SECTION_RE = /\b(desk|floor|kitchen|bar|front|back|house|staff|team|crew|servers?|cooks?|managers?|cashiers?|registers?|counter|drivers?|hosts?|bartenders?|dish|prep|line|security|reception|warehouse|office)\b/i;
const TIME_PART = '(\\d{1,2}(?::?\\d{2})?(?::\\d{2})?(?:am?|pm?)?|noon|midnight|open(?:ing)?|clos(?:e|ing)|cl)';

// Lowercase, and join "8 a.m." / "8 AM" into "8am".
const normalizeCell = v => String(v || '').toLowerCase()
  .replace(/\b([ap])\.\s?m\.?/g, '$1m')
  .replace(/(\d)\s+([ap]m?)(?![a-z])/g, '$1$2')
  .replace(/\s+/g, ' ').trim();

function dayWord(s) {
  const w = String(s || '').toLowerCase().match(/[a-z]+/);
  return w && w[0] in DAY_WORDS ? DAY_WORDS[w[0]] : null;
}

function parseDays(str) {
  const s = String(str || '').toLowerCase().trim();
  if (!s) return null;
  if (/^(daily|every ?day|all( days)?|7 days)$/.test(s)) return [0, 1, 2, 3, 4, 5, 6];
  if (/^week ?days?$/.test(s)) return [0, 1, 2, 3, 4];
  if (/^week ?ends?$/.test(s)) return [5, 6];

  const norm = s.replace(/\s*(?:-|–|—|\bto\b|\bthru\b|\bthrough\b)\s*/g, '-');
  for (const tok of norm.split(/[\s,\/&+;]+/).filter(t => t && t !== 'and')) {
    const [a, b] = tok.split('-');
    const da = dayWord(a);
    if (da == null) return null;
    if (!b) { out.add(da); continue; }

    if (db == null) return null;
    for (let d = da; ; d = (d + 1) % 7) { out.add(d); if (d === db) break; }

// Without am/pm, a start time of 6-11 is morning and 1-5 is afternoon; an end time picks whichever
// reading makes the shorter shift after `after`.
function parseClock(raw, after, opts = {}) {
  const s = normalizeCell(raw).replace(/[\s.]/g, '');
  if (s === 'noon') return 720;
  if (s === 'midnight') return 0;
  if (/^open(ing)?$/.test(s)) return opts.open ?? null;
  if (/^(clos(e|ing)|cl)$/.test(s)) return opts.close ?? null;

function makeDate(y, mo, d) {

function dateCandidates(raw) {

function stripTimes(label) {

  return toks.filter((t, i) => !(timeish(t)
      || (/^(a\.?m\.?|p\.?m\.?|to|till?|until|close|open|cl)$/i.test(word(t)) && (timeish(toks[i - 1] || '') || timeish(toks[i + 1] || '')))))

}

function parseTable(text) {
  const src = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const first = src.split('\n').find(l => l.trim()) || '';
  const delim = first.includes('\t') ? '\t' : first.split(';').length > first.split(',').length ? ';' : ',';

  for (let i = 0; i < src.length; i++) {

    } else if (c === '"' && !cell.trim()) { quoted = true; cell = ''; }
    else if (c === delim) { row.push(cell); cell = ''; }

// Works out the layout by itself:
//   grid  - a row per person, a column per day (title rows above it and "FRONT DESK" heading rows are fine)
//   names - rows are shift times ("Front Desk 8-4") and the day cells hold names
//   list  - a row per shift with Name / Day (or Date) / Start / End columns
//   plain - the same without a heading row
function parseSchedule(text, opts = {}) {
  const rows = parseTable(text);
  const res = { shifts: [], errors: [], notes: new Set(), needs: new Set(), layout: '', weekOf: '' };
  if (!rows.length) return res;
  const tidy = v => String(v || '').trim().replace(/\s+/g, ' ');
  const prettyArea = a => {
    const t = tidy(a).replace(/:$/, '').trim();
    return t.length > 4 && t === t.toUpperCase() ? t.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()) : t;
  };
  const fail = (where, f) => {
    if (f.need) res.needs.add(f.need);
    res.errors.push(`${where}: couldn’t read “${f.text}”${f.need ? ` (set the ${f.need === 'open' ? 'opening' : 'closing'} time below)` : ''}`);
  };
  const noteDate = d => { const k = weekKey(mondayOf(d)); if (!res.weekOf || k < res.weekOf) res.weekOf = k; };

  let h = -1, head = null;
  for (let i = 0; i < Math.min(rows.length, 15) && h < 0; i++) {
    const info = readHeader(rows[i]);
    if (info.count >= 2) { h = i; head = info; }
  }

  if (h >= 0) {
    const labels = rows[h].map(c => tidy(c).toLowerCase());
    const isDay = i => head.days[i] != null;
    let areaCol = labels.findIndex((l, i) => !isDay(i) && AREA_RE.test(l));
    let nameCol = labels.findIndex((l, i) => !isDay(i) && i !== areaCol && NAME_RE.test(l));
    if (nameCol < 0) nameCol = labels.findIndex((l, i) => !isDay(i) && i !== areaCol && !SKIP_RE.test(l));
    if (nameCol < 0 && areaCol >= 0) { nameCol = areaCol; areaCol = -1; }
    if (nameCol < 0) { res.errors.push('Add a column with each person’s name.'); return res; }
    head.dates.forEach(d => { if (d) noteDate(d); });
    const dayCols = head.days.map((d, i) => (d != null && i !== nameCol && i !== areaCol ? i : -1)).filter(i => i >= 0);
    let area = '', last = '', byPerson = 0, byTime = 0;

    rows.slice(h + 1).forEach((r, ri) => {
      const rowNo = h + ri + 2;
      const label = tidy(r[nameCol]);
      const rowArea = areaCol >= 0 ? prettyArea(r[areaCol]) : '';
      const filled = dayCols.filter(c => tidy(r[c]));
      if (TOTAL_ROW_RE.test(label)) return;
      if (!filled.length) {
        // A row with just a heading ("FRONT DESK", "Kitchen:") groups the rows below it.
        const rest = r.some((c, i) => i !== nameCol && tidy(c));
        if (label && !rest && (/:$/.test(label) || (label === label.toUpperCase() && /[A-Z]/.test(label)) || SECTION_RE.test(label))) {
          area = prettyArea(label);
          last = '';
        }
        return;
      }
      // A row labelled with a time ("Front Desk 8-4") whose day cells hold names.
      const labelTimes = label ? findRanges(label, opts) : [];
      if (labelTimes.length === 1 && filled.every(c => !findRanges(r[c]).length)
          && filled.some(c => !/\d/.test(r[c]) && !OFF_RE.test(tidy(r[c])))) {
        const t = labelTimes[0];
        if (!t.ok) { fail(`Row ${rowNo}`, t); return; }
        const shiftArea = rowArea || prettyArea(stripTimes(label)) || area;
        for (const c of filled) {
          for (const piece of r[c].split(/\s*(?:[,\/&;+\n]|\band\b)\s*/)) {
            const name = tidy(piece);
            if (!name || OFF_RE.test(name)) continue;
            if (/\d/.test(name)) res.errors.push(`Row ${rowNo}, ${DAY_SHORT[head.days[c]]}: couldn’t read “${name}”`);
            else res.shifts.push({ name, area: shiftArea, day: head.days[c], start: t.start, end: t.end });
          }
        }
        byTime++;
        return;
      }
      // A row per person. A row with no name continues the person above (a second shift that day).
      const name = label || last;
      if (!name) { res.errors.push(`Row ${rowNo}: missing a name`); return; }
      if (label) last = label;
      byPerson++;
      for (const c of filled) {
        const cell = tidy(r[c]), where = `Row ${rowNo} (${name}, ${DAY_SHORT[head.days[c]]})`;
        if (OFF_RE.test(cell)) continue;
        const found = findRanges(cell, opts);
        if (!found.length) {
          if (/\d|open|clos/i.test(cell)) res.errors.push(`${where}: couldn’t read “${cell}”`);
          else res.notes.add(cell);
          continue;
        }
        for (const f of found) {
          if (f.ok) res.shifts.push({ name, area: rowArea || area, day: head.days[c], start: f.start, end: f.end });
          else fail(where, f);
        }
      }
    });
    res.layout = byTime && byPerson ? 'mixed' : byTime ? 'names' : 'grid';
    return res;
  }

  let lh = -1;
  for (let i = 0; i < Math.min(rows.length, 15) && lh < 0; i++) {
    const l = rows[i].map(c => tidy(c).toLowerCase());
    if (l.some(x => NAME_RE.test(x)) && l.some(x => /^(days?|date|weekday|when)\b/.test(x))) lh = i;
  }
  let nameCol, dayCol, startCol, endCol, timeCol, areaCol;
  if (lh >= 0) {
    const labels = rows[lh].map(c => tidy(c).toLowerCase());
    const find = re => labels.findIndex(x => re.test(x));
    nameCol = find(NAME_RE);
    dayCol = find(/^(days?|date|weekday|when)\b/);
    startCol = find(/\bstart|begin|^from$|^in$|clock ?in|time in/);
    endCol = find(/\bend\b|finish|^to$|^out$|until|clock ?out|time out/);
    timeCol = labels.findIndex((x, i) => i !== startCol && i !== endCol && /time|shift|hours/.test(x));
    areaCol = find(AREA_RE);
    res.layout = 'list';
  } else {
    [nameCol, dayCol, startCol, endCol, areaCol, timeCol] = [0, 1, 2, 3, 4, -1];
    res.layout = 'plain';
  }

  rows.slice(lh + 1).forEach((r, i) => {
    const rowNo = lh + i + 2;
    const quiet = lh < 0 && i === 0; // an unrecognised heading row
    const name = tidy(r[nameCol]);
    if (!name || TOTAL_ROW_RE.test(name)) { if (!name && !quiet) res.errors.push(`Row ${rowNo}: missing a name`); return; }
    const dayText = tidy(r[dayCol]);
    let days = parseDays(dayText);
    if (!days || !days.length) {
      const d = dateCandidates(dayText)[0];
      if (d) { days = [dayIdx(d)]; noteDate(d); }
    }
    let area = areaCol >= 0 ? prettyArea(r[areaCol]) : '';
    let times = [];
    if (lh < 0 && findRanges(r[2], opts).length) { times = findRanges(r[2], opts); area = prettyArea(r[3]); }
    else if (startCol >= 0 && endCol >= 0) {
      const start = parseClock(r[startCol], null, opts);
      const end = start == null ? null : parseClock(r[endCol], start, opts);
      const text = `${tidy(r[startCol])}–${tidy(r[endCol])}`;
      const word = [r[startCol], r[endCol]].map(normalizeCell).find(w => /^(open|clos|cl$)/.test(w));
      times = [start != null && end != null && end !== start
        ? { ok: true, start, end, text }
        : { ok: false, text, need: word ? (word.startsWith('open') ? 'open' : 'close') : '' }];
    } else if (timeCol >= 0) times = findRanges(r[timeCol], opts);
    const where = `Row ${rowNo} (${name})`;
    if (!days || !days.length) { if (!quiet) res.errors.push(`${where}: couldn’t read the day “${dayText}”`); return; }
    if (!times.length) { if (!quiet) res.errors.push(`${where}: couldn’t read the time`); return; }
    for (const t of times) {
      if (!t.ok) { if (!quiet) fail(where, t); continue; }
      for (const day of days) res.shifts.push({ name, area, day, start: t.start, end: t.end });
    }
  });
  return res;
}

/* ---------- storage: this device (demo) or Firebase (shared) ---------- */
function normalizeBoard(d) {
  const shifts = {};
  for (const [id, s] of Object.entries((d && d.shifts) || {})) {
    if (!s || typeof s.name !== 'string' || !Number.isInteger(s.day) || !Number.isFinite(s.start) || !Number.isFinite(s.end)) continue;
    shifts[id] = clean({ name: s.name, day: s.day, start: s.start, end: s.end, since: s.since, until: s.until, only: s.only });
    shifts[id].area = s.area || '';
  }
  const st = (d && d.settings) || {};
  const mins = v => (Number.isFinite(v) ? v : null);
  return {
    settings: { name: st.name || '', pin: !st.pin || String(st.pin) === OLD_DEFAULT_PIN ? DEFAULT_PIN : String(st.pin), sheet: st.sheet || '', sheetHash: st.sheetHash || '', openAt: mins(st.openAt), closeAt: mins(st.closeAt) },
    shifts,
    example: !!(d && d.example),
  };
}

function exampleData() {
  const plan = [
    ['Maya Ortiz', 'Front Desk', [0, 2, 4], 480, 960],
    ['Jordan Lee', 'Front Desk', [1, 3], 480, 960],
    ['Sam Patel', 'Front Desk', [0, 1, 2, 3, 4], 870, 1350],
    ['Dee Brooks', 'Front Desk', [5, 6], 540, 1020],
    ['Riley Chen', 'Main Floor', [0, 1, 2, 5, 6], 600, 1080],
    ['Jordan Lee', 'Main Floor', [4], 720, 1200],
    ['Maya Ortiz', 'Main Floor', [5], 660, 1140],
  ];
  const shifts = {};
  let n = 0;
  for (const [name, area, days, start, end] of plan) for (const day of days) shifts[`ex${n++}`] = { name, area, day, start, end };
  // Example clock-ins for the current week, so the tracking is visible straight away.
  const monday = mondayOf(new Date()), now = Date.now();
  const inJitter = [-4, 2, -1, 11, 0, -6, 3, 7, -2, 1], outJitter = [2, -3, 5, 0, -8, 1, 4, -1, 6, 3];
  const week = {};
  let k = 0, live = false;
  for (const [id, s] of Object.entries(shifts)) {
    const startMs = at(monday, s.day, s.start), endMs = startMs + shiftMins(s) * 60000;
    const base = { name: s.name, area: s.area, day: s.day, start: s.start, end: s.end };
    if (endMs < now && k % 7 !== 5) {
      week[id] = { ...base, clockIn: startMs + inJitter[k % 10] * 60000, clockOut: endMs + outJitter[k % 10] * 60000 };
    } else if (!live && startMs < now && now < endMs) {
      week[id] = { ...base, clockIn: startMs + 3 * 60000, clockOut: null };
      live = true;
    }
    k++;
  }
  return { board: { settings: { name: '', pin: DEFAULT_PIN }, shifts, example: true }, weeks: { [weekKey(monday)]: week } };
}

function localBackend() {
  const KEY = 'shiftboard-data-v1';
  const read = () => attempt(() => JSON.parse(localStorage.getItem(KEY)));
  const copy = v => JSON.parse(JSON.stringify(v));
  let data = read();
  let boardCb = null, weekCb = null, wk = null;
  const emit = () => {
    if (boardCb) boardCb(normalizeBoard(copy(data.board)));
    if (weekCb) weekCb(copy(data.weeks[wk] || {}));
  };
  const change = fn => { fn(); local.set(KEY, JSON.stringify(data)); emit(); return Promise.resolve(); };
  window.addEventListener('storage', e => { if (e.key === KEY) { data = read() || data; emit(); } });
  return {
    kind: 'local',
    async start(cb) {
      if (!data || !data.board || !data.weeks) { data = exampleData(); local.set(KEY, JSON.stringify(data)); }
      boardCb = cb;
      cb(normalizeBoard(copy(data.board)));
    },
    watchWeek(id, cb) {
      wk = id; weekCb = cb;
      cb(copy(data.weeks[id] || {}));
      return () => { if (weekCb === cb) weekCb = null; };
    },
    saveShift: (id, s) => change(() => { data.board.shifts[id] = s; }),
    removeShift: id => change(() => { delete data.board.shifts[id]; }),
    replaceShifts: map => change(() => { data.board.shifts = map; data.board.example = false; }),
    saveSettings: st => change(() => { Object.assign(data.board.settings, st); }),
    savePunch: (w, id, p) => change(() => { (data.weeks[w] = data.weeks[w] || {})[id] = p; }),
    removePunch: (w, id) => change(() => { if (data.weeks[w]) delete data.weeks[w][id]; }),
    clockIn: (w, id, p) => change(() => { (data.weeks[w] = data.weeks[w] || {})[id] = { ...p, clockIn: Date.now(), clockOut: null }; }),
    clockOut: (w, id) => change(() => { const p = data.weeks[w] && data.weeks[w][id]; if (p && !p.clockOut) p.clockOut = Date.now(); }),
    reset: () => change(() => { data = { board: { settings: { ...data.board.settings }, shifts: {}, example: false }, weeks: {} }; }),
    // Demo mode has no accounts: the PIN is the only lock, and it lives in this browser.
    account: () => null,
    isManager: async () => true,
    checkPin: async v => v === normalizeBoard(data.board).settings.pin,
    setPin: pin => change(() => { data.board.settings.pin = pin; }),
  };
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Could not load ${src}`));
    document.head.append(s);
  });
}

// Shared mode. What each person may do is enforced by Google's servers through firestore.rules, not by this page:
//   staff (a silent anonymous sign-in): read the schedule, clock in and out of a scheduled shift, nothing else;
//   managers (a Google account listed in firestore.rules): everything. The PIN is a second, quick lock on their devices.
function cloudBackend(config, boardId) {
  let fb = null, auth = null, ref = null, FieldValue = null, Timestamp = null, boardExists = false;
  const punchesOf = wk => ref.collection('weeks').doc(wk).collection('punches');
  const privateDoc = () => ref.collection('private').doc('config');
  const toMs = v => (v && typeof v.toMillis === 'function' ? v.toMillis() : typeof v === 'number' ? v : null);
  const anonymous = () => !auth.currentUser || auth.currentUser.isAnonymous;
  const update = data => (boardExists ? Promise.resolve() : ref.set({ shifts: {}, settings: { name: '' } }, { merge: true }))
    .then(() => ref.update(data));
  return {
    kind: 'cloud',
    async start(onBoard, onError) {
      await loadScript(FIREBASE_SDK + 'firebase-app-compat.js');
      await Promise.all([loadScript(FIREBASE_SDK + 'firebase-auth-compat.js'), loadScript(FIREBASE_SDK + 'firebase-firestore-compat.js')]);
      fb = window.firebase;
      fb.initializeApp(config);
      auth = fb.auth();
      const db = fb.firestore();
      const emu = window.SHIFTBOARD_EMULATOR; // local testing only; never set on the real site
      if (emu) { auth.useEmulator(emu.auth, { disableWarnings: true }); db.useEmulator(emu.host, emu.port); }
      FieldValue = fb.firestore.FieldValue;
      Timestamp = fb.firestore.Timestamp;
      await new Promise(resolve => { const off = auth.onAuthStateChanged(() => { off(); resolve(); }); });
      if (!auth.currentUser) await auth.signInAnonymously();
      ref = db.collection('shiftboards').doc(boardId);
      ref.onSnapshot(snap => { boardExists = snap.exists; onBoard(normalizeBoard(snap.data() || {})); }, onError);
    },
    watchWeek: (id, cb, onError) => punchesOf(id).onSnapshot(snap => {
      const out = {};
      snap.forEach(doc => {
        const p = doc.data({ serverTimestamps: 'estimate' });
        if (typeof p.name === 'string' && Number.isInteger(p.day)) out[doc.id] = { ...p, clockIn: toMs(p.clockIn), clockOut: toMs(p.clockOut) };
      });
      cb(out);
    }, onError),
    saveShift: (id, s) => update({ [`shifts.${id}`]: s }),
    removeShift: id => update({ [`shifts.${id}`]: FieldValue.delete() }),
    replaceShifts: map => update({ shifts: map }),
    saveSettings: st => update(Object.fromEntries(Object.entries(st).map(([k, v]) => [`settings.${k}`, v]))),
    // Clock-ins and clock-outs are stamped with Google's clock, so a phone can't fake the time.
    clockIn: (w, id, p) => punchesOf(w).doc(id).set({ ...p, clockIn: FieldValue.serverTimestamp(), clockOut: null }),
    clockOut: (w, id) => punchesOf(w).doc(id).update({ clockOut: FieldValue.serverTimestamp() }),
    savePunch: (w, id, p) => punchesOf(w).doc(id).set({
      ...p, clockIn: Timestamp.fromMillis(p.clockIn), clockOut: p.clockOut == null ? null : Timestamp.fromMillis(p.clockOut),
    }),
    removePunch: (w, id) => punchesOf(w).doc(id).delete(),
    account: () => (anonymous() ? null : { email: auth.currentUser.email || '' }),
    async isManager() {
      if (anonymous()) return false;
      try { await privateDoc().get(); return true; } catch { return false; }
    },
    signIn: () => auth.signInWithPopup(new fb.auth.GoogleAuthProvider()),
    async signOut() { await auth.signOut(); await auth.signInAnonymously(); },
    async checkPin(v) {
      const snap = await privateDoc().get();
      return v === String((snap.exists && snap.data().pin) || DEFAULT_PIN);
    },
    setPin: pin => privateDoc().set({ pin }, { merge: true }),
  };
}

function explain(err) {
  const code = String((err && err.code) || '');
  if (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation')
    return 'A sign-in method is off. In Firebase, open Authentication → Sign-in method and turn on Anonymous and Google.';
  if (code === 'auth/unauthorized-domain')
    return 'This site’s address isn’t approved yet. In Firebase, open Authentication → Settings → Authorized domains and add it.';
  if (code === 'auth/popup-blocked')
    return 'The sign-in window was blocked. Allow pop-ups for this site and try again.';
  if (code === 'permission-denied')
    return 'Firebase refused access. Paste the rules from firestore.rules into Firestore → Rules and publish them.';
  if (code.startsWith('auth/api-key') || code === 'auth/invalid-api-key')
    return 'The Firebase settings in config.js don’t match a project. Copy them again from the Firebase console.';
  if (code === 'auth/network-request-failed' || code === 'unavailable')
    return 'No internet connection. Check the connection and reload the page.';
  return (err && err.message) || 'Something went wrong while connecting.';
}

/* ---------- state ---------- */
let backend = null, backendReady = false;
let board = { settings: { name: '', pin: DEFAULT_PIN }, shifts: {}, example: false };
let punches = {};
let boardReady = false, weekReady = false;
let status = 'local', statusDetail = '';
let viewMonday = mondayOf(new Date());
let selDay = dayIdx(new Date());
let tab = 'schedule';
let manager = session.get('shiftboard-manager') === '1';
let who = local.get('shiftboard-who') || '';
let unwatchWeek = null;
let lastWeek = weekKey(mondayOf(new Date())), lastDay = new Date().toDateString();

const thisMonday = () => mondayOf(new Date());
const viewKey = () => weekKey(viewMonday);
const isThisWeek = () => viewKey() === weekKey(thisMonday());

// A repeating shift runs from `since` to `until` (dates, both optional); a one-time shift has `only` (its week).
function activeIn(s, monday) {
  if (s.only) return s.only === weekKey(monday);
  const date = isoDate(addDays(monday, s.day));
  return !(s.since && date < s.since) && !(s.until && date > s.until);
}

// The week's rows: the repeating schedule, with any clock-in for that week laid over it.
// A clock-in keeps a copy of the shift it was for, so past weeks stay correct after the schedule changes or expires.
function weekRows() {
  const rows = [];
  for (const [id, s] of Object.entries(board.shifts)) {
    const p = punches[id];
    if (!p && !activeIn(s, viewMonday)) continue;
    rows.push(p
      ? { id, name: p.name, area: p.area || '', day: p.day, start: p.start, end: p.end, punch: p, once: !!s.only }
      : { id, name: s.name, area: s.area || '', day: s.day, start: s.start, end: s.end, punch: null, once: !!s.only });
  }
  for (const [id, p] of Object.entries(punches)) {
    if (!board.shifts[id]) rows.push({ id, name: p.name, area: p.area || '', day: p.day, start: p.start, end: p.end, punch: p, removed: true });
  }
  return rows.sort((a, b) => a.day - b.day || a.start - b.start || a.name.localeCompare(b.name));
}
const visibleRows = () => weekRows().filter(r => !who || r.name === who);
const findRow = id => weekRows().find(r => r.id === id);

function allNames() {
  const names = new Set(Object.values(board.shifts).map(s => s.name));
  for (const p of Object.values(punches)) names.add(p.name);
  return [...names].sort((a, b) => a.localeCompare(b));
}

const canStart = r => weekReady && !r.punch && isThisWeek() && r.day === dayIdx(new Date());

function rowInfo(r) {
  const now = Date.now();
  const startMs = at(viewMonday, r.day, r.start);
  const sched = shiftMins(r);
  const info = { startMs, endMs: startMs + sched * 60000, sched, worked: 0, late: 0, state: 'up', overdue: false };
  const p = r.punch;
  if (!weekReady) info.state = 'loading';
  else if (p && p.clockIn) {
    info.worked = ((p.clockOut || now) - p.clockIn) / 60000;
    info.late = Math.round((p.clockIn - startMs) / 60000);
    info.state = p.clockOut ? 'done' : 'on';
  } else if (canStart(r)) {
    info.state = 'ready';
    info.overdue = now > startMs + LATE_GRACE * 60000;
  } else if (info.endMs < now) info.state = 'miss';
  return info;
}
const STATUS_WORDS = { up: 'Upcoming', ready: 'Not started', on: 'On shift', done: 'Done', miss: 'No clock-in', loading: '' };
const lateTag = (r, i) => (r.punch && i.late > LATE_GRACE ? `<span class="tag-late">Late ${dur(i.late)}</span>` : '');

/* ---------- rendering ---------- */
function render() {
  const name = board.settings.name.trim();
  $('#biz-name').textContent = name || 'Shift Board';
  document.title = name ? `${name} · Shifts` : 'Shift Board';

  $('#week-range').textContent = weekLabel(viewMonday);
  $('#week-tag').textContent = weekTag(viewMonday);
  $('#who-chip').hidden = !who;
  $('#who-chip-name').textContent = who;

  $$('.tab[data-tab]').forEach(t => (t.dataset.tab === tab ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current')));
  $('#mgr-tab').setAttribute('aria-pressed', String(manager));
  $('#mgr-icon').innerHTML = icon(manager ? 'unlockSolid' : 'lockSolid', 26);
  $('#view-schedule').hidden = tab !== 'schedule';
  $('#view-hours').hidden = tab !== 'hours';
  $('#days').hidden = tab !== 'schedule';

  const names = allNames();
  if (who && !names.includes(who) && boardReady) { who = ''; local.set('shiftboard-who', null); $('#who-chip').hidden = true; }
  $('#names-list').innerHTML = names.map(n => `<option value="${esc(n)}"></option>`).join('');
  const areas = [...new Set(Object.values(board.shifts).map(s => s.area).filter(Boolean))].sort();
  $('#areas-list').innerHTML = areas.map(a => `<option value="${esc(a)}"></option>`).join('');

  renderBanner();
  renderFoot();
  if (tab === 'schedule') { renderDays(); renderSchedule(); } else renderHours();
}

function renderBanner() {
  let html = '';
  if (status === 'error') {
    html += `<div class="banner is-error"><p><strong>Can’t reach the shared schedule.</strong> ${esc(statusDetail)}</p></div>`;
  }
  if (manager) {
    html += `<div class="banner is-mgr"><p><strong>Manager mode is on.</strong> Tap a shift to edit it or fix its clock times.</p>
      <button type="button" class="btn btn-sm" data-action="manager">Manager tools</button>
      <button type="button" class="btn btn-sm" data-action="lock">Lock</button></div>`;
  }
  if (manager && sheetCheck.changed) {
    html += `<div class="banner is-mgr"><p><strong>Your Google Sheet has changed.</strong> Review the changes before they go on the schedule.</p>
      <button type="button" class="btn btn-sm" data-action="sheet-review">Review changes</button></div>`;
  }
  if (board.example) {
    html += `<div class="banner"><p><strong>This is an example schedule</strong> with made-up people, so you can try it out. Tap a shift to clock in or out. When you’re ready, open Manager and upload the real schedule.</p>
      <button type="button" class="btn btn-sm" data-action="clear-example">Clear example</button></div>`;
  }
  const ending = endingSoon();
  if (manager && ending.length && !nextScheduleLinedUp()) {
    const last = ending.map(s => s.until).sort().pop();
    html += `<div class="banner"><p><strong>${ending.length} repeating shift${ending.length === 1 ? '' : 's'} stop${ending.length === 1 ? 's' : ''} by ${fmtDate(last)}.</strong> Upload the next schedule with its start date, or keep these going with no end date.</p>
      <button type="button" class="btn btn-sm" data-action="extend">Keep them going</button></div>`;
  }
  $('#banner').innerHTML = html;
}

function renderFoot() {
  let line;
  if (status === 'live') line = `<span class="pill ok">Live</span>Changes show up on every phone and computer right away.`;
  else if (status === 'connecting') line = `<span class="pill">Connecting</span>Loading the shared schedule…`;
  else if (status === 'error') line = `<span class="pill bad">Offline</span>${esc(statusDetail)}`;
  else line = `<span class="pill">This device only</span>Demo mode: the schedule and clock-ins are saved in this browser. Connect Firebase (see SETUP.md) to share it with everyone.`;
  $('#foot').innerHTML = `<p>${line}</p><p>The schedule repeats every week. Clock-ins start fresh each Monday, and past weeks stay in the history: use the arrows to look back.</p>`;
}

function renderDays() {
  const today = isThisWeek() ? dayIdx(new Date()) : -1;
  let html = '';
  for (let d = 0; d < 7; d++) {
    const date = addDays(viewMonday, d);
    html += `<button type="button" class="dayhead${d === today ? ' is-today' : ''}${d === selDay ? ' is-sel' : ''}" data-day="${d}" aria-pressed="${d === selDay}" aria-label="${DAY_NAMES[d]} ${date.getDate()} ${MONTHS[date.getMonth()]}">
      <span class="dow">${DAY_SHORT[d]}</span><span class="num">${date.getDate()}</span><span class="mon">${MONTHS[date.getMonth()]}</span></button>`;
  }
  $('#days').innerHTML = html;
}

function cardHTML(r) {
  const i = rowInfo(r);
  let meta = '', bandOn = '';
  if (i.state === 'on') bandOn = `<span class="band-on">On shift<span class="band-dur"> · <span data-live-from="${r.punch.clockIn}">${dur(i.worked)}</span></span></span>`;
  else if (i.state === 'done') meta = `<span class="st-done">${icon('check', 12)}${dur(i.worked)}</span>`;
  else if (i.state === 'ready') meta = i.overdue ? `<span class="st-late">Not started</span>` : `<span class="st-ready">Tap to start</span>`;
  else if (i.state === 'miss') meta = `<span class="st-miss">No clock-in</span>`;
  if (r.punch && i.late > LATE_GRACE) meta += `<span class="st-late">Late ${dur(i.late)}</span>`;
  const cls = ['card', `s-${i.state}`, r.once ? 'is-once' : ''].filter(Boolean).join(' ');
  return `<button type="button" class="${cls}" data-shift="${esc(r.id)}">
    <span class="time"><span>${clockHTML(r.start)}</span><span>${clockHTML(r.end)}</span></span>
    <span class="who">${esc(r.name)}</span>
    <span class="meta">${meta}</span>${bandOn}
  </button>`;
}

function renderSchedule() {
  const el = $('#view-schedule');
  if (!boardReady) { el.innerHTML = `<p class="loading">Loading the schedule…</p>`; return; }
  const rows = visibleRows();
  if (!rows.length && !manager) {
    el.innerHTML = who
      ? `<div class="empty"><h2>No shifts for ${esc(who)} this week</h2><button type="button" class="btn" data-action="show-all">Show everyone</button></div>`
      : `<div class="empty"><h2>No shifts this week yet</h2><p>A manager can upload the weekly schedule. It repeats every week, so this only needs doing when the schedule changes.</p><button type="button" class="btn btn-primary" data-action="manager">Open manager tools</button></div>`;
    return;
  }
  const today = isThisWeek() ? dayIdx(new Date()) : -1;
  const areas = [...new Set(rows.map(r => r.area))];
  if (manager) for (const s of Object.values(board.shifts)) if (activeIn(s, viewMonday) && !areas.includes(s.area || '')) areas.push(s.area || '');
  if (!areas.length) areas.push('');
  areas.sort((a, b) => (a === '') - (b === '') || a.localeCompare(b));
  const labelled = areas.some(Boolean);

  let html = `<div class="board"><div class="cols" aria-hidden="true">`;
  for (let d = 0; d < 7; d++) html += `<span${d === today ? ' class="is-today"' : ''}></span>`;
  html += `</div><div class="board-inner">`;
  for (const area of areas) {
    const inArea = rows.filter(r => r.area === area);
    html += `<section class="area">${labelled ? `<h2 class="area-name">${esc(area || 'Other')}</h2>` : ''}<div class="row">`;
    for (let d = 0; d < 7; d++) {
      const cards = inArea.filter(r => r.day === d).map(cardHTML).join('');
      const add = manager
        ? `<button type="button" class="add" data-add-day="${d}" data-add-area="${esc(area)}" aria-label="Add a shift on ${DAY_NAMES[d]}">+<span class="add-l"> Add</span></button>`
        : '';
      html += `<div class="cell">${cards}${add}</div>`;
    }
    html += `</div></section>`;
  }
  html += `</div></div>`;
  el.innerHTML = html;
}

function renderHours() {
  const el = $('#view-hours');
  if (!boardReady) { el.innerHTML = `<p class="loading">Loading timesheets…</p>`; return; }
  const rows = visibleRows();
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><h2>No hours for this week</h2><p>Hours appear here as people clock in and out.</p></div>`;
    return;
  }
  const people = new Map();
  for (const r of rows) { if (!people.has(r.name)) people.set(r.name, []); people.get(r.name).push(r); }
  let tSched = 0, tWorked = 0, onNow = 0;
  const cards = [...people.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, list]) => {
    let sched = 0, worked = 0, diff = 0, done = 0;
    const lines = list.map(r => {
      const i = rowInfo(r);
      sched += i.sched; worked += i.worked;
      if (i.state === 'on') onNow++;
      if (i.state === 'done') { diff += i.worked - i.sched; done++; }
      const date = addDays(viewMonday, r.day);
      let act, w = '—', extra = '';
      if (i.state === 'done') { act = `In ${clockAt(r.punch.clockIn)} · Out ${clockAt(r.punch.clockOut)}`; w = dur(i.worked); extra = signedDur(i.worked - i.sched); }
      else if (i.state === 'on') { act = `On shift since ${clockAt(r.punch.clockIn)}`; w = `<span data-live-from="${r.punch.clockIn}">${dur(i.worked)}</span>`; }
      else if (i.state === 'miss') { act = 'No clock-in'; w = '0h'; }
      else if (i.state === 'ready') act = i.overdue ? 'Not started' : 'Today, not started yet';
      else act = STATUS_WORDS[i.state] || '';
      return `<li><button type="button" class="line s-${i.state}" data-shift="${esc(r.id)}">
        <span class="l-day">${DAY_SHORT[r.day]} ${date.getDate()}</span>
        <span class="l-sched">${clock(r.start)}–${clock(r.end)}</span>
        <span class="l-w">${w}</span>
        <span class="l-act">${act}${lateTag(r, i)}</span>
        <span class="l-diff">${extra}</span>
      </button></li>`;
    }).join('');
    tSched += sched; tWorked += worked;
    const pct = sched ? Math.min(100, (worked / sched) * 100) : 0;
    return `<article class="person">
      <div class="person-head"><span class="avatar" aria-hidden="true">${esc(initials(name))}</span><h3>${esc(name)}</h3>
        <span class="tot">${dur(worked)} <span class="of">of ${dur(sched)}</span></span>
        ${done ? `<span class="chip" title="Worked minus scheduled, for finished shifts">${signedDur(diff)}</span>` : ''}</div>
      <div class="bar" role="img" aria-label="${dur(worked)} worked of ${dur(sched)} scheduled"><span style="width:${pct.toFixed(1)}%"></span></div>
      <ul class="lines">${lines}</ul>
    </article>`;
  }).join('');
  el.innerHTML = `<div class="hours">
    <div class="sum">
      <div class="stat"><span class="k">Scheduled</span><span class="v">${dur(tSched)}</span></div>
      <div class="stat"><span class="k">${isThisWeek() ? 'Worked so far' : 'Worked'}</span><span class="v">${dur(tWorked)}</span></div>
      ${isThisWeek() ? `<div class="stat on"><span class="k">On shift now</span><span class="v">${onNow}</span></div>` : ''}
      <p class="sum-note">Tap a line to see the time card.${manager ? ' Export hours is under Manager tools.' : ''}</p>
    </div>
    <div class="people">${cards}</div>
  </div>`;
}

function updateLive() {

}

const sheet = $('#sheet'), sheetBody = $('#sheet-body');
let sheetState = null;

function openSheet(build, live = false) {

function closeSheet() { if (sheet.open) sheet.close(); }

const sheetHead = (eyebrow, title) => `<div class="sheet-head"><div><p class="eyebrow">${esc(eyebrow)}</p><h2 id="sheet-title">${esc(title)}</h2></div>

/* shift time card */
function shiftSheet(id) {
  const r = findRow(id);
  if (!r) return `${sheetHead('Shift', 'Shift removed')}<p class="lede">This shift is no longer on the schedule.</p>`;
  const i = rowInfo(r), p = r.punch;
  const date = addDays(viewMonday, r.day);
  const where = [`${DAY_NAMES[r.day]} ${date.getDate()} ${MONTHS[date.getMonth()]}`, r.area].filter(Boolean).join(' · ');

  let action;
  if (i.state === 'on') action = `<button type="button" class="btn btn-stop btn-big" data-act="end" data-id="${esc(id)}">${icon('stop', 20)}End shift</button>`;
  else if (i.state === 'ready') action = `<button type="button" class="btn btn-go btn-big" data-act="start" data-id="${esc(id)}">${icon('play', 20)}Start shift</button>`;
  else if (i.state === 'done') action = `<p class="note ok">Shift done · ${dur(i.worked)} worked</p>`;
  else if (i.state === 'miss') action = `<p class="note warn">This shift passed without a clock-in.${manager ? ' Add the times below if they worked it.' : ' Ask a manager to add the times.'}</p>`;
  else if (i.state === 'loading') action = `<p class="note">Loading clock-ins…</p>`;
  else action = `<p class="note">You can start this shift on ${isThisWeek() ? DAY_NAMES[r.day] : `${DAY_NAMES[r.day]} ${date.getDate()} ${MONTHS[date.getMonth()]}`}.</p>`;

  const worked = p
    ? (i.state === 'on' ? `<span data-live-from="${p.clockIn}">${dur(i.worked)}</span>` : dur(i.worked))
    : '—';
  let html = `${sheetHead(where, r.name)}
    <div class="timecard${i.state === 'miss' ? ' is-miss' : ''}">
      <div class="tc-row"><span class="tc-label">Scheduled</span><span class="tc-val">${clock(r.start, true)} – ${clock(r.end, true)}</span><span class="tc-aux">${dur(i.sched)}</span></div>
      <div class="tc-row"><span class="tc-label">Clock in</span><span class="tc-val">${p ? clockAt(p.clockIn, true) : '—'}</span><span class="tc-aux">${lateTag(r, i)}</span></div>
      <div class="tc-row"><span class="tc-label">Clock out</span><span class="tc-val">${p && p.clockOut ? clockAt(p.clockOut, true) : '—'}</span><span class="tc-aux">${i.state === 'on' ? 'still on shift' : ''}</span></div>
      <div class="tc-row tc-total"><span class="tc-label">Worked</span><span class="tc-val">${worked}</span><span class="tc-aux">${i.state === 'done' ? `${signedDur(i.worked - i.sched)} vs schedule` : ''}</span></div>
    </div>
    ${action}`;
  if (r.removed) html += `<p class="hint">This shift is no longer on the schedule. The clock-in is kept for the hours record.</p>`;
  else html += `<p class="hint">${repeatText(board.shifts[id])}</p>`;

  if (manager) {
    const inVal = p ? hhmm(minsOf(p.clockIn)) : hhmm(r.start);
    const outVal = p && p.clockOut ? hhmm(minsOf(p.clockOut)) : (p ? '' : hhmm(r.end));
    html += `<hr class="divider"><p class="subhead">Manager: fix clock times</p>
      <div class="two">
        <label class="field">Clock in<input type="time" id="fx-in" value="${inVal}"></label>
        <label class="field">Clock out<input type="time" id="fx-out" value="${outVal}"></label>
      </div>
      <p class="hint">For ${DAY_NAMES[r.day]} ${date.getDate()} ${MONTHS[date.getMonth()]}. Leave clock out empty if they’re still working. An out time earlier than the in time counts as the next morning.</p>
      <p class="err" id="fx-err" role="alert"></p>
      <div class="btnrow">
        <button type="button" class="btn" data-act="fix-save" data-id="${esc(id)}">Save times</button>
        ${p ? `<button type="button" class="btn btn-danger" data-act="fix-clear" data-id="${esc(id)}">Remove clock-in</button>` : ''}
      </div>
      ${r.removed ? '' : `<button type="button" class="btn" data-act="edit" data-id="${esc(id)}">Edit or delete this shift</button>`}`;
  }
  return html;
}
const openShift = id => openSheet(() => shiftSheet(id), !manager);

function startShift(id) {
  const r = findRow(id);
  if (!r || !canStart(r)) return;
  backend.clockIn(viewKey(), id, { name: r.name, area: r.area, day: r.day, start: r.start, end: r.end }).catch(saveFailed);
  closeSheet();
  toast(`${firstName(r.name)} clocked in at ${clockAt(Date.now(), true)}`);
}
function endShift(id) {
  const r = findRow(id);
  if (!r || !r.punch || r.punch.clockOut) return;
  backend.clockOut(viewKey(), id).catch(saveFailed);
  closeSheet();
  toast(`${firstName(r.name)} clocked out · ${dur((Date.now() - r.punch.clockIn) / 60000)} worked`);
}
function saveFix(id) {
  const r = findRow(id);
  if (!r) return;
  const inMin = fromHHMM($('#fx-in').value), outMin = fromHHMM($('#fx-out').value);
  if (inMin == null) { $('#fx-err').textContent = 'Enter a clock-in time.'; return; }
  const clockIn = at(viewMonday, r.day, inMin);
  let clockOut = null;
  if (outMin != null) {
    clockOut = at(viewMonday, r.day, outMin);
    if (clockOut <= clockIn) clockOut = at(viewMonday, r.day + 1, outMin);
  }
  const base = r.punch || { name: r.name, area: r.area, day: r.day, start: r.start, end: r.end };
  backend.savePunch(viewKey(), id, { ...base, clockIn, clockOut, edited: true }).catch(saveFailed);
  closeSheet();
  toast('Clock times saved');
}
function clearFix(id) {
  backend.removePunch(viewKey(), id).catch(saveFailed);
  closeSheet();
  toast('Clock-in removed');
}

    <label class="field">Area <span class="opt">optional, like Front Desk or Kitchen</span><input id="f-area" list="areas-list" autocomplete="off" value="${esc(s ? s.area : preset.area || '')}"></label>
    <fieldset class="field"><legend>${s ? 'Day' : 'Days'} <span class="opt">${s ? '' : 'pick one or more'}</span></legend>
      <div class="daypick-row">${DAY_SHORT.map((d, i) => `<button type="button" data-act="pickday" data-day="${i}" aria-pressed="${days.has(i)}" aria-label="${DAY_NAMES[i]}">${d}</button>`).join('')}</div>
    </fieldset>

      <label class="field">Start<input type="time" id="f-start" value="${hhmm(s ? s.start : 540)}"></label>
      <label class="field">End<input type="time" id="f-end" value="${hhmm(s ? s.end : 1020)}"></label>
    </div>
    <p class="hint" id="f-len"></p>
    <label class="field">Repeats<select id="f-repeat">
      <option value="weekly"${repeat ? ' selected' : ''}>Every week</option>
      <option value="once"${repeat ? '' : ' selected'}>Only the week of ${weekLabel(viewMonday)}</option>
    </select></label>
    <div class="two f-dates"${repeat ? '' : ' hidden'}>
      <label class="field">Starts<input type="date" id="f-since" value="${s ? s.since || '' : viewKey()}"></label>
      <label class="field">Ends <span class="opt">optional</span><input type="date" id="f-until" value="${s ? s.until || '' : ''}"></label>
    </div>
    <p class="hint f-dates"${repeat ? '' : ' hidden'}>Leave Ends empty to keep it repeating. After the end date it drops off the schedule by itself.</p>
    <p class="err" id="f-err" role="alert"></p>
    <div class="btnrow">
      <button type="submit" class="btn btn-primary">${s ? 'Save changes' : 'Add shift'}</button>
      ${s ? `<button type="button" class="btn btn-danger" data-act="delete" data-id="${esc(id)}">Delete shift</button>` : ''}
    </div>
  </form>`;
}
function openEdit(id, preset = {}) {
  const s = id ? board.shifts[id] : null;
  form = { id, days: new Set(s ? [s.day] : [preset.day != null ? preset.day : selDay]) };
  openSheet(() => editSheet(id, preset));
  updateLen();
}
function updateLen() {
  const start = fromHHMM($('#f-start') && $('#f-start').value), end = fromHHMM($('#f-end') && $('#f-end').value);
  const el = $('#f-len');
  if (!el) return;
  el.textContent = start == null || end == null || start === end ? '' : `${dur(shiftMins({ start, end }))} shift${end < start ? ', ends the next morning' : ''}`;
}
function pickDay(btn) {
  const d = Number(btn.dataset.day);
  if (form.id) form.days = new Set([d]);
  else if (form.days.has(d)) form.days.delete(d);
  else form.days.add(d);
  $$('[data-act="pickday"]', sheetBody).forEach(b => b.setAttribute('aria-pressed', String(form.days.has(Number(b.dataset.day)))));
}
function submitEdit() {
  const err = $('#f-err');
  const name = $('#f-name').value.trim().replace(/\s+/g, ' ');
  const area = $('#f-area').value.trim().replace(/\s+/g, ' ');
  const start = fromHHMM($('#f-start').value), end = fromHHMM($('#f-end').value);
  const repeat = $('#f-repeat').value === 'weekly';
  const since = repeat ? $('#f-since').value || undefined : undefined;
  const until = repeat ? $('#f-until').value || undefined : undefined;
  if (!name) { err.textContent = 'Enter the person’s name.'; return; }
  if (!form.days.size) { err.textContent = 'Pick at least one day.'; return; }
  if (start == null || end == null) { err.textContent = 'Enter a start and an end time.'; return; }
  if (start === end) { err.textContent = 'The start and end can’t be the same time.'; return; }
  if (since && until && until < since) { err.textContent = 'The end date is before the start date.'; return; }
  const wk = viewKey();
  if (form.id) {
    const old = board.shifts[form.id] || {};
    const s = clean({ name, day: [...form.days][0], start, end, since, until, only: repeat ? undefined : old.only || wk });
    s.area = area;
    backend.saveShift(form.id, s).catch(saveFailed);
    toast('Shift saved');
  } else {
    let n = 0;
    for (const day of form.days) {
      const s = clean({ name, day, start, end, since, until, only: repeat ? undefined : wk });
      s.area = area;
      backend.saveShift(uid() + n++, s).catch(saveFailed);
    }
    toast(n === 1 ? 'Shift added' : `${n} shifts added`);
  }
  closeSheet();
}
function deleteShift(id) {
  backend.removeShift(id).catch(saveFailed);
  closeSheet();
  toast('Shift deleted');
}

// A Google Sheets link (edit, share or published) as CSV download addresses to try in turn.
function sheetCsvUrls(link) {
  const s = String(link || '').trim();
  const gid = (s.match(/[#?&]gid=(\d+)/) || [])[1];
  const g = gid ? `&gid=${gid}` : '';
  let m = s.match(/docs\.google\.com\/spreadsheets\/d\/e\/([\w-]+)/);
  if (m) return [`https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv${g}`];
  m = s.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]{20,})/);
  if (m) return [`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv${g}`, `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g}`];
  return [];
}
async function fetchSheet(link) {
  const urls = sheetCsvUrls(link);
  if (!urls.length) throw new Error('That doesn’t look like a Google Sheets link. Copy it from the address bar or from Share → Copy link.');
  let reached = false;
  for (const u of urls) {
    try {
      const res = await fetch(u, { cache: 'no-store' });
      reached = true;
      const text = await res.text();
      if (res.ok && !/^\s*<(!doctype|html)/i.test(text)) return text;
    } catch { /* blocked or offline: try the next address */ }
  }
  throw new Error(reached
    ? 'Google didn’t share the sheet. In Google Sheets, click Share, set General access to “Anyone with the link”, and try again.'
    : 'Couldn’t reach Google Sheets. Check the internet connection and try again.');
}

const shiftKey = s => [s.name.toLowerCase(), (s.area || '').toLowerCase(), s.day, s.start, s.end].join('|');
function fingerprint(shifts) {
  const s = shifts.map(shiftKey).sort().join('\n');
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + s.length.toString(36);
}
// How a newly read schedule differs from the repeating shifts running in the week it starts.
function scheduleDiff(parsed, sinceKey) {
  const [y, m, d] = String(sinceKey || weekKey(thisMonday())).split('-').map(Number);
  const monday = mondayOf(new Date(y, m - 1, d));
  const count = list => list.reduce((acc, k) => acc.set(k, (acc.get(k) || 0) + 1), new Map());
  const now = count(Object.values(board.shifts).filter(s => !s.only && activeIn(s, monday)).map(shiftKey));
  const next = count(parsed.map(shiftKey));
  let added = 0, removed = 0;
  for (const [k, n] of next) added += Math.max(0, n - (now.get(k) || 0));
  for (const [k, n] of now) removed += Math.max(0, n - (next.get(k) || 0));
  return { added, removed, empty: !now.size };
}

    const t = totals.get(r.name) || { sched: 0, worked: 0 };

    case 'clear-example': requireManager(clearExample); break;
    case 'extend': requireManager(extendEnding); break;
    case 'sheet-review': requireManager(() => openUpload({ text: sheetCheck.text, source: 'sheet' })); break;
    case 'show-all': setWho(''); break;
  }
});

sheetBody.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'close': closeSheet(); break;
    case 'pickwho': closeSheet(); setWho(el.dataset.name || ''); break;
    case 'start': startShift(id); break;
    case 'end': endShift(id); break;
    case 'edit': openEdit(id); break;
    case 'fix-save': saveFix(id); break;
    case 'fix-clear': if (confirmTap(el, 'Tap again to remove')) clearFix(id); break;
    case 'pickday': pickDay(el); break;
    case 'delete': if (confirmTap(el, 'Tap again to delete')) deleteShift(id); break;
    case 'clear-all': if (confirmTap(el, 'Tap again to delete every shift')) clearAll(); break;
    case 'apply-replace': applyUpload('replace'); break;
    case 'apply-add': applyUpload('add'); break;
    case 'template': downloadTemplate(); break;
    case 'm-upload': openUpload(); break;
    case 'm-sheet': openUpload({ autoRead: true }); break;
    case 'g-read': readSheet(); break;
    case 'unlink': unlinkSheet(); break;
    case 'google-signin': googleSignIn(); break;
    case 'm-signout': signOutGoogle(); break;
    case 'm-add': openEdit(null, { day: selDay }); break;
    case 'm-export': closeSheet(); exportCSV(); break;
    case 'm-settings': openSettings(); break;
    case 'm-lock': closeSheet(); lock(); break;
  }
});
sheetBody.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pin-form') submitPin();
  else if (e.target.id === 'edit-form') submitEdit();
  else if (e.target.id === 'settings-form') submitSettings();
});
sheetBody.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'g-url') { e.preventDefault(); readSheet(); }
});
sheetBody.addEventListener('input', e => {
  if (e.target.id === 'u-text') { upload.source = 'paste'; previewUpload(); }
  if (e.target.id === 'u-open' || e.target.id === 'u-close') previewUpload();
  if (e.target.id === 'u-since') upload.sinceTouched = true;
  if (e.target.closest('#edit-form')) updateLen();
});
sheetBody.addEventListener('change', e => {
  if (e.target.id === 'u-file') readUploadFile(e.target.files[0]);
  if (e.target.id === 'f-repeat') $$('.f-dates', sheetBody).forEach(el => { el.hidden = e.target.value !== 'weekly'; });
});

/* ---------- clock ---------- */
let ticks = 0;
function tick() {
  updateLive();
  const wk = weekKey(thisMonday()), day = new Date().toDateString();
  if (wk !== lastWeek) {
    // A new week started: the schedule carries over and clock-ins start fresh.
    if (viewKey() === lastWeek) { viewMonday = thisMonday(); watchWeek(); }
    lastWeek = wk;
  }
  if (day !== lastDay) { lastDay = day; if (isThisWeek()) selDay = dayIdx(new Date()); render(); return; }
  if (++ticks % 3 === 0 && !$('#main').contains(document.activeElement)) render();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  tick();
  sheetCheck.key = ''; // back from editing the sheet in another tab: look again
  checkSheet();
});

/* ---------- start ---------- */
function onBoard(b) { board = b; boardReady = true; render(); refreshSheet(); checkSheet(); }
function onError(err) { console.error(err); status = 'error'; statusDetail = explain(err); render(); }

async function init() {
  for (const el of $$('[data-icon]')) el.outerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 20);
  const cfg = window.SHIFTBOARD_FIREBASE;
  backend = cfg && cfg.projectId ? cloudBackend(cfg, String(window.SHIFTBOARD_ID || 'main')) : localBackend();
  status = backend.kind === 'cloud' ? 'connecting' : 'local';
  render();
  try {
    await backend.start(onBoard, onError);
    backendReady = true;
    if (backend.kind === 'cloud') status = 'live';
    // A remembered "manager mode on" only counts if this device is still signed in as a manager.
    if (manager && !(await backend.isManager())) { manager = false; session.set('shiftboard-manager', null); }
    watchWeek();
    render();
  } catch (err) { onError(err); }
}
init();
})();
</script>
</body>
</html>
